{{- if .Values.ingresses -}}
{{- if .Values.ingresses.enabled -}}
{{- $servicePort := .Values.service.ingress_port -}}
{{- range .Values.ingresses.manifests }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  {{- if eq .nameSuffix ""  }}
  name: {{ template "application.name" $ }}
  {{- else }}
  name: {{ template "application.name" $ }}-{{ .nameSuffix }}
  {{- end }}
  {{- /* No chart-version label here: some ingress controllers reconfigure on any Ingress
  change, labels included, so a chart bump alone would trigger that. */}}
  labels:
{{ include "application.labels" $ | indent 4 }}
{{- if .labels }}
{{ toYaml .labels | indent 4 }}
{{- end }}
{{- /* ingresses.annotations apply to every manifest; a manifest's own annotations win. */}}
{{- $annotations := merge (deepCopy (.annotations | default dict)) (deepCopy ($.Values.ingresses.annotations | default dict)) }}
{{- if $annotations }}
  annotations:
{{ toYaml $annotations | indent 4 }}
{{- end }}
spec:
  rules:
    {{- range .hosts }}
    - host: {{ .host }}
      http:
        paths:
          {{- $port := .port }}
          {{- range .paths }}
          - path: {{ . }}
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ template "application.name" $ }}
                port:
                {{- if $port }}
                  number: {{ $port }}
                {{- else }}
                  number: {{ $servicePort }}
                {{- end }}
          {{- end }}
    {{- end -}}
  {{- if .tls }}
  tls:
{{ toYaml .tls | indent 4 }}
  {{- end }}
---
{{- end }}
{{- end -}}
{{- end -}}
