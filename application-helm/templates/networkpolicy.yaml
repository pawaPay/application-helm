{{- if .Values.networkpolicy -}}
{{- if .Values.networkpolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-egress-vpn-network-policy
  namespace: {{ $.Release.Namespace }}
spec:
  podSelector: {}
  policyTypes:
  - Egress
  egress:
  - to:
    - ipBlock:
        cidr: 0.0.0.0/0
        except:
        {{- range $ip := .Values.networkpolicy.except }}
        {{- if not ( has $ip $.Values.networkpolicy.allow ) }}
        - {{ $ip }}
        {{- end }}
       {{- end }}
{{- end }}
{{- end }}


