{{- if .Values.sync_secrets.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ template "application.name" $ }}-sync-secrets
  namespace: argocd
  {{- if .Values.sync_secrets.annotations }}
  annotations:
{{ toYaml .Values.sync_secrets.annotations | indent 4 }}
  {{- end }}
spec:
  ttlSecondsAfterFinished: 120
  template:
    spec:
      serviceAccountName: sync-secrets
      containers:
      - name: sync-secrets
        image: 768383028426.dkr.ecr.eu-central-1.amazonaws.com/pawapay-sync-secrets:{{ .Values.sync_secrets.image.tag }}
        args: []
        env:
        - name: APP_ID
          valueFrom:
            secretKeyRef:
              name: github-creds
              key: APP_ID
        - name: INSTALLATION_ID
          valueFrom:
            secretKeyRef:
              name: github-creds
              key: INSTALLATION_ID
        - name: PRIVATE_KEY
          valueFrom:
            secretKeyRef:
              name: github-creds
              key: PRIVATE_KEY

        - name: SERVICE
          value: {{ template "application.name" . }}
        - name: ENVIRONMENT
          value: {{ .Values.environment }}
        - name: BRANCH
          value: "develop"
      restartPolicy: Never
  backoffLimit: 2

{{- end }}
