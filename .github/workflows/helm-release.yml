# This is a basic workflow to help you get started with Actions

name: Release Charts

on:
  push:
    branches:
    - develop
    paths:
    - "application-helm/**"
    - ".github/workflows/helm-release.yml"

jobs:
  build:
    # GitHub-hosted: this repo is public, so it must not run on self-hosted runners
    runs-on: ubuntu-latest
    # chart-releaser only needs to push gh-pages and create releases
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v7.0.1
    
    # https://github.com/helm/chart-releaser-action/issues/13#issuecomment-602058369
    - name: Fetch history
      run: git fetch --prune --unshallow

    - name: Configure Git
      run: |
        git config user.name "$GITHUB_ACTOR"
        git config user.email "$GITHUB_ACTOR@users.noreply.github.com"
        
    - name: Run chart-releaser
      uses: helm/chart-releaser-action@v1.7.0
      env:
        CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
      with: 
        charts_repo_url: https://pawapay.github.io/application-helm/
        charts_dir: "."
